name: Verify documentation

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build VuePress site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Chrome for PDF generation
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check Chrome for PDF generation
        run: ${{ steps.chrome.outputs.chrome-path }} --version

      - name: Build and verify release artifacts
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Show last lines of failed build
        if: failure()
        run: tail -n 60 /tmp/verify.log >> "${GITHUB_STEP_SUMMARY}"
